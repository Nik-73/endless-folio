<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Crawler engine — specimen plates</title>
<style>
  :root { --paper: #f4efe4; --ink: #1d1b16; --rule: #d8cfbd; --muted: #7a7263; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 Georgia, 'Times New Roman', serif; }
  header.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; justify-content: space-between;
    padding: 18px 20px 12px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--paper); z-index: 5; }
  h1 { font-size: 20px; margin: 0; font-weight: normal; letter-spacing: .02em; }
  h1 small { color: var(--muted); font-size: 13px; margin-left: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 12px ui-monospace, Menlo, monospace; }
  button { font: inherit; background: transparent; border: 1px solid var(--ink); color: var(--ink); padding: 6px 10px; cursor: pointer; border-radius: 0; touch-action: manipulation; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #fps { color: var(--muted); min-width: 9ch; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1px; background: var(--rule); border-bottom: 1px solid var(--rule); }
  .plate { background: var(--paper); display: flex; flex-direction: column; min-width: 0; }
  .plate h2 { margin: 0; padding: 12px 14px 2px; font-size: 16px; font-weight: normal; font-style: italic; }
  .plate .meta { padding: 0 14px 8px; font: 11px ui-monospace, Menlo, monospace; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 2px; vertical-align: -1px; }
  .field { position: relative; height: 330px; overflow: hidden; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); }
  .field .text { padding: 14px 16px; font-size: 14px; line-height: 1.7; color: #3b372f; user-select: none; -webkit-user-select: none; }
  .field .img { float: right; width: 92px; height: 92px; margin: 4px 0 6px 12px; border: 1px solid var(--ink);
    background: repeating-linear-gradient(45deg, transparent 0 5px, rgba(0,0,0,.12) 5px 6px); position: relative; }
  .field .img::after { content: attr(data-caption); position: absolute; left: 0; right: 0; bottom: -16px; font: 9px ui-monospace, monospace; color: var(--muted); text-align: center; }
  .field a { color: #2b4fbf; text-decoration: underline; text-decoration-thickness: 1px; }
  .field canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .traits { padding: 8px 14px 14px; font: 11px/1.6 ui-monospace, Menlo, monospace; color: var(--muted); }
  .traits b { color: var(--ink); font-weight: normal; }
  .state { margin-left: auto; color: var(--ink); }
  /* world effects */
  .w, .field a, .img { transition: opacity 1.2s, background-color .4s; border-radius: 2px; }
  .cw-fx-read { background: color-mix(in srgb, var(--cw-color, #ff3f8e) 30%, transparent); }
  .cw-fx-tug { animation: tug .5s ease-in-out 2; display: inline-block; }
  .cw-fx-inspect, .cw-fx-perch { outline: 1px dashed var(--cw-color, #ff3f8e); outline-offset: 3px; }
  .cw-fx-hide { opacity: .55; }
  .cw-fx-jostle { animation: jostle .4s ease-in-out 3; display: inline-block; }
  .cw-fx-nibble { background: color-mix(in srgb, var(--cw-color, #ff3f8e) 18%, transparent); }
  .cw-eaten { opacity: .18; }
  @keyframes tug { 50% { transform: translate(2px, 2px) rotate(-2deg); } }
  @keyframes jostle { 25% { transform: translate(-1px, 1px) rotate(-3deg); } 75% { transform: translate(1px, -1px) rotate(3deg); } }
  footer { padding: 16px 20px 40px; font: 12px/1.6 ui-monospace, Menlo, monospace; color: var(--muted); }
  footer a { color: inherit; }
  @media (max-width: 420px) {
    main { grid-template-columns: 1fr; }
    header.top { padding: 12px 14px 10px; }
    .field { height: 300px; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Crawler engine <small>six specimen plates</small></h1>
  <div class="controls">
    <button id="sound" aria-pressed="false">sound off</button>
    <button id="wake">wake all</button>
    <button id="shuffle">new seeds</button>
    <button id="debug" aria-pressed="false">debug</button>
    <span id="fps">— fps</span>
  </div>
</header>
<main id="plates"></main>
<footer>
  Move the pointer near a sleeping specimen (or touch near it) to wake it. Tap a creature to poke it; tap elsewhere in its plate to call it over; press and hold to make most follow you.
  Seeds via <code>?seeds=a,b,c</code>. Engine docs: <a href="API.md">API.md</a>.
</footer>
<script type="module">
import { createCrawler, createStubWorld, audio, toAttributes } from './src/index.js?v=20261028144733';
import { createRng } from './src/rng.js?v=20261028144733';

const params = new URLSearchParams(location.search);
const DEFAULT_SEEDS = ['4', '12', '10', '1', '77', '365']; // one of each body plan
let seeds = (params.get('seeds') || '').split(',').map((s) => s.trim()).filter(Boolean);
if (!seeds.length) seeds = DEFAULT_SEEDS;
seeds = seeds.slice(0, 6);

const WORDS = ('specimen observed under glass moves along margins of printed matter favouring warm paper and the ' +
  'smell of ink it is said to read in the dark and to sleep inside indices folded between plates ' +
  'collectors report a soft clicking each leg sounding its own note older catalogues describe colonies ' +
  'nesting in footnotes feeding on adjectives and avoiding bold type entirely').split(' ');
const LINKS = ['Order Folivora', 'marginalia', 'the 1891 survey', 'index mites', 'see Plate IV'];

function plateText(seed) {
  const r = createRng(seed + ':page');
  const n = 46 + r.int(0, 18), out = [];
  const img = `<span class="img" data-caption="fig. ${r.int(1, 99)}"></span>`;
  for (let i = 0; i < n; i++) {
    if (i === 6) out.push(img);
    if (r.chance(0.07)) out.push(`<a href="#" onclick="return false">${r.pick(LINKS)}</a>`);
    else out.push(`<span class="w">${r.pick(WORDS)}</span>`);
  }
  return out.join(' ') + '.';
}

const handles = [];
const main = document.getElementById('plates');
let debug = false;

function build() {
  for (const h of handles) { h.destroy(); h.world.destroy(); }
  handles.length = 0;
  main.innerHTML = '';
  for (const seed of seeds) {
    const el = document.createElement('section');
    el.className = 'plate';
    el.innerHTML = `<h2></h2><div class="meta"></div><div class="field"><div class="text">${plateText(seed)}</div><canvas></canvas></div><div class="traits"></div>`;
    main.append(el);
    const field = el.querySelector('.field'), canvas = el.querySelector('canvas');
    const world = createStubWorld({ root: field.querySelector('.text'), canvas, paperColor: '#f4efe4' });
    const c = createCrawler({ seed, canvas, world, pointerTarget: field, debug, startAwake: false });
    const T = c.traits, P = T.palette;
    el.querySelector('h2').textContent = T.name.full;
    el.querySelector('.meta').innerHTML = `<span>${T.id}</span><span>seed ${T.seed}</span>
      <span><i class="swatch" style="background:${P.ink}"></i><i class="swatch" style="background:${P.accent}"></i><i class="swatch" style="background:${P.tint}"></i>${P.name}</span>
      <span class="state">asleep</span>`;
    el.querySelector('.traits').innerHTML = toAttributes(T).map((a) => `${a.trait_type.toLowerCase()} <b>${a.value}</b>`).join(' · ');
    c.start();
    handles.push(Object.assign(c, { stateEl: el.querySelector('.state'), world, lastMode: '' }));
  }
}
build();

setInterval(() => {
  let fps = 0, ms = 0;
  for (const h of handles) {
    if (h.mode !== h.lastMode) { h.lastMode = h.mode; h.stateEl.textContent = h.mode; }
    fps = h.stats.fps; ms += h.stats.frameMs;
  }
  document.getElementById('fps').textContent = `${fps} fps · ${ms.toFixed(1)}ms`;
}, 500);

const soundBtn = document.getElementById('sound');
audio.setMuted(true);
soundBtn.onclick = () => {
  const on = audio.muted;
  audio.setMuted(!on);
  soundBtn.setAttribute('aria-pressed', String(on));
  soundBtn.textContent = on ? 'sound on' : 'sound off';
};
document.getElementById('wake').onclick = () => handles.forEach((h) => h.wake('button'));
document.getElementById('shuffle').onclick = () => {
  seeds = Array.from({ length: 6 }, () => String((Math.random() * 2 ** 32) >>> 0));
  const q = new URLSearchParams(location.search); q.set('seeds', seeds.join(','));
  history.replaceState(null, '', '?' + q);
  build();
};
document.getElementById('debug').onclick = (e) => {
  debug = !debug; e.target.setAttribute('aria-pressed', String(debug));
  handles.forEach((h) => h.setDebug(debug));
};
window.__engine = { handles, audio };
</script>
</body>
</html>
